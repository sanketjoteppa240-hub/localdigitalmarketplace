<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | LocalMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1 class="auth-logo">LocalMart<span>.</span></h1>
        <h2>Welcome back</h2>
        <p class="auth-description">Log in to view your LocalMart profile.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post" action="{{ url_for('login') }}">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" value="{{ email }}"
                   autocomplete="email" maxlength="254" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit" class="register-btn">Log in</button>
        </form>

        <p class="auth-switch">New to LocalMart? <a href="{{ url_for('register') }}">Create an account</a></p>
        <a href="{{ url_for('home') }}" class="back-home">← Back to LocalMart</a>
    </main>
</body>
</html>
