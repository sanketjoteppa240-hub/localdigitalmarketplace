
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | LocalMart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-card">

        <h1 class="auth-logo">LocalMart<span>.</span></h1>

        <h2>Create Your Account</h2>

        <p class="auth-description">
            Join LocalMart and discover amazing local businesses.
        </p>

        <!-- Display messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                maxlength="80"
                value="{{ name }}"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                maxlength="254"
                value="{{ email }}"
                autocomplete="email"
                required
            >

            <label for="role">Account Type</label>

            <select id="role" name="role" required>
                <option value="customer" {% if role == "customer" %}selected{% endif %}>Customer</option>
                <option value="seller" {% if role == "seller" %}selected{% endif %}>Seller</option>
            </select>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <a href="/" class="back-home">
            ← Back to LocalMart
        </a>
        <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>

    </div>

</body>
</html>
